    { key: 'idiom-second',   kind: 'idiom',   topics: ['행동','상태','관계'],  emoji: '🪓', label: '행동·상태 관용어',  sub: '양철 나무꾼을 만나러 가요', cutscene: 'tinwoodman', friendKey: 'tinwoodman', progressKey: 'learnedIdiomSecond'  },
    { key: 'proverb-first',  kind: 'proverb', topics: ['말','노력','사람'],    emoji: '🦁', label: '말·노력·사람 속담', sub: '겁쟁이 사자를 만나러 가요', cutscene: 'lion',       friendKey: 'lion',       progressKey: 'learnedProverbFirst' },
    { key: 'proverb-second', kind: 'proverb', topics: ['교훈','상황'],         emoji: '🛤️', label: '교훈·상황 속담',    sub: '노란 벽돌 길로 출발해요',   cutscene: 'yellowRoad', friendKey: null,         progressKey: 'learnedProverbSecond' }
  ];

  function getS1Chunk(key) { return S1_CHUNKS.find(c => c.key === key); }

  function getChunkItems(chunk) {
    const base = chunk.kind === 'idiom' ? state.idioms : state.proverbs;
    return base.filter(it => chunk.topics.includes(it.topic));
  }

  function enterStage1() {
    state.s1.mode = 'choose';
    state.s1.kind = null;
    state.s1.chunk = null;
    renderStage1();
  }

  function renderStage1() {
    const root = document.getElementById('stage1Content');
    const m = state.s1.mode;

    if (m === 'choose') {
      const p = state.progress;
      root.innerHTML = `
        <div class="pick-wrap">
          <div class="pick-title">무엇을 배워 볼까요?</div>
          <div class="pick-grid">
            ${S1_CHUNKS.map(c => {
              const done = p[c.progressKey];
              return `
                <button class="pick-card ${done ? 'done' : ''}" data-chunk="${c.key}">
                  <div class="pick-emoji">${c.emoji}</div>
                  <div class="pick-name">${c.label}</div>
                  <div class="pick-sub">${done ? '완료 ✓ 다시 보기' : c.sub}</div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
      root.querySelectorAll('[data-chunk]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ck = getS1Chunk(btn.getAttribute('data-chunk'));
          state.s1.kind = ck.kind;
          state.s1.chunk = ck.key;
          state.s1.mode = 'intro';
          renderStage1();
        });
      });
      return;
    }

    if (m === 'intro') {
      const ck = getS1Chunk(state.s1.chunk);
      const isIdiom = ck.kind === 'idiom';
      const introTitle = isIdiom ? '관용어란?' : '속담이란?';
      const introBody = isIdiom
        ? `<p>둘 이상의 낱말이 합쳐져 <b>본래 뜻과 다른 새로운 뜻</b>을 가지는 말이에요.</p>
           <p>예) <b>발이 넓다</b><br>→ 진짜 발이 넓은 게 아니라 <b>아는 사람이 많다</b>는 뜻이에요!</p>`
        : `<p>오래 전부터 전해 내려오는 <b>짧은 가르침</b>이에요. 비유적인 말로 인생의 지혜를 알려 줘요.</p>
           <p>예) <b>가는 말이 고와야 오는 말이 곱다</b><br>→ 내가 좋게 말해야 남도 좋게 답한다는 뜻이에요.</p>`;
      const introEmoji = isIdiom ? '📖' : '📜';
      const imageFile = isIdiom ? 'intro_idiom.png' : 'intro_proverb.png';
      root.innerHTML = `
        <div class="intro-wrap">
          <div class="intro-card">
            ${renderImg(imageFile, introEmoji, 'intro-image-wrap')}
            <div class="intro-text">
              <div class="intro-title">${introTitle} <span style="font-size:22px;color:var(--text-muted);">· ${ck.label}</span></div>
              <div class="intro-body">${introBody}</div>
              <div class="intro-actions">
                <button class="btn btn-primary" id="introStart">${ck.label} 배우러 가기 →</button>
                <button class="btn btn-ghost" data-go="home">메뉴로</button>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('introStart').onclick = () => {
        state.s1.mode = 'learn';
        state.s1.items = shuffle(getChunkItems(ck).slice());
        state.s1.index = 0; state.s1.step = 0;
        renderStage1();
      };
      root.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.getAttribute('data-go'))));
      return;
    }

    if (m === 'learn') {
      const ck = getS1Chunk(state.s1.chunk);
      const items = state.s1.items;
      if (!items || items.length === 0) { root.innerHTML = '<div class="empty-msg">데이터가 없습니다.</div>'; return; }
      const item = items[state.s1.index];
      const isLast = state.s1.index === items.length - 1;
      const stepLabel = state.s1.step === 0 ? '한 번 더 누르면 뜻이 나와요'
                       : state.s1.step === 1 ? '한 번 더 누르면 예문이 나와요'
                       : '잘 봤어요! 다음으로 넘어가요';

      const real = Array.isArray(item.realExamples) && item.realExamples.length ? item.realExamples : [];
      const oneExample = real.length ? real[0] : '';

      const cs = CUTSCENES[ck.cutscene];
      const lastBtnLabel = cs ? cs.title.replace(/^[^\s]+\s*/, '').replace(/!$/, '') + ' →' : '다음 →';

      root.innerHTML = `
        <div class="learn-meta">${ck.label} · ${state.s1.index + 1} / ${items.length}</div>
        <div class="flashcard" id="fcRoot">
          ${renderImg(item.imageUrl, ck.kind === 'idiom' ? '🖼️' : '📜', 'fc-image-box')}
          <div class="fc-right">
            <div class="fc-term">${renderTopicBadge(item.topic)}${escapeHtml(item.term)}</div>
            ${state.s1.step >= 1 ? `<div class="fc-meaning">${escapeHtml(item.meaning)}</div>` : ''}
            ${state.s1.step >= 2
                ? (oneExample ? `<div class="fc-example">예) ${escapeHtml(oneExample)}</div>` : '')
                : `<div class="fc-hint-row"><div class="fc-hint">👆 ${stepLabel}</div></div>`}
          </div>
        </div>
        <div class="fc-nav">
          <button id="learnPrev" class="btn btn-ghost" ${state.s1.index === 0 ? 'disabled' : ''}>← 이전</button>
          <button id="learnNext" class="btn btn-primary">${isLast ? lastBtnLabel : '다음 →'}</button>
        </div>
      `;
      document.getElementById('fcRoot').onclick = () => { if (state.s1.step < 2) { state.s1.step++; renderStage1(); } };
      document.getElementById('learnPrev').onclick = (e) => { e.stopPropagation(); if (state.s1.index > 0) { state.s1.index--; state.s1.step = 0; renderStage1(); } };
      document.getElementById('learnNext').onclick = (e) => {
        e.stopPropagation();
        if (state.s1.index < items.length - 1) { state.s1.index++; state.s1.step = 0; renderStage1(); }
        else {
          state.progress[ck.progressKey] = true;
          if (ck.friendKey && !state.progress.friends.includes(ck.friendKey)) {
            state.progress.friends.push(ck.friendKey);
          }
          saveProgress(state.currentStudent);
          state.s1.mode = 'cutscene';
          renderStage1();
        }
      };
      return;
    }

    if (m === 'cutscene') {
      const ck = getS1Chunk(state.s1.chunk);
      const cs = CUTSCENES[ck.cutscene];
      root.innerHTML = renderCutscene(cs);
      document.getElementById('cutsceneNext').onclick = () => {
        if (ck.key === 'proverb-second') {
          // 마지막 청크: 노란 벽돌 길로 출발 → 홈으로 (2단계 잠금 해제)
          show('home');
        } else {
          state.s1.mode = 'choose';
          state.s1.kind = null;
          state.s1.chunk = null;
          renderStage1();
        }
      };
      return;
    }
  }

  function renderTopicBadge(topic) {
    if (!topic) return '';
    return `<span class="topic-badge">${escapeHtml(topic)}</span>`;
  }

  function resolveImageUrl(filename) {
    if (!filename) return '';
    if (filename.startsWith('http') || filename.startsWith('data:')) return filename;
    let key = filename;
    if (key.startsWith('images/')) key = key.substring('images/'.length);
    if (state.imageMap && state.imageMap[key]) return state.imageMap[key];
    return 'images/' + key; // 로컬 미리보기용 폴백
  }

  function applyScreenBackgrounds() {
    const targets = [
      { id: 'loginImage',  file: 'intro_tornado.png',           overlay: 'linear-gradient(rgba(43, 33, 24, 0.15), rgba(43, 33, 24, 0.15))' },
      { id: 'screen-home', file: 'intro_yellow_brick_road.png', overlay: 'linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2))' }
    ];
    targets.forEach(t => {
      const url = resolveImageUrl(t.file);
      const el = document.getElementById(t.id);
      if (el && url) el.style.backgroundImage = t.overlay + ", url('" + url + "')";
    });
  }

  function renderImg(filename, fallbackEmoji, className) {
    if (filename) {
      const src = resolveImageUrl(filename);
      return `<div class="${className}"><img src="${escapeHtml(src)}" alt="" onerror="this.parentElement.innerHTML='${fallbackEmoji}'"></div>`;
    }
    return `<div class="${className}">${fallbackEmoji}</div>`;
  }

  function renderCutscene(cs) {
    const src = resolveImageUrl(cs.imageUrl);
    return `
      <div class="cutscene-wrap">
        <div class="cutscene-card">
          ${src ? `<div class="cutscene-image"><img src="${escapeHtml(src)}" alt="" onerror="this.parentElement.innerHTML='${cs.emoji}'"></div>` : `<div class="cutscene-image">${cs.emoji}</div>`}
          <div class="cutscene-text">
            <div class="cutscene-title">${cs.title}</div>
            <div class="cutscene-body">${cs.body}</div>
            <div class="cutscene-actions">
              <button id="cutsceneNext" class="btn btn-primary">${cs.action}</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  /* ====== 2/3단계 ====== */
  function enterStage(stage) {
    state.quiz.stage = stage; state.quiz.mode = 'list';
    renderStage(stage);
  }
  function renderStage(stage) {
    const root = document.getElementById('stage' + stage + 'Content');
    const m = state.quiz.mode;
    if (m === 'list')     return renderChapterList(stage, root);
    if (m === 'intro')    return renderChapterIntro(stage, root);
    if (m === 'play')     return renderQuestion(stage, root);
    if (m === 'result')   return renderChapterResult(stage, root);
    if (m === 'cutscene') return renderStageCutscene(stage, root);
  }

  function renderChapterList(stage, root) {
    const chapters = stage === 2 ? STAGE2_CHAPTERS : STAGE3_CHAPTERS;
    const done = stage === 2 ? state.progress.stage2Chapter : state.progress.stage3Chapter;
    root.innerHTML = `
      <div class="chapter-grid">
        ${chapters.map(ch => {
          const status = ch.num <= done ? 'done' : (ch.num === done + 1 ? '' : 'locked');
          const rewardLabel = ch.reward || (stage === 2 ? '🎁' : '⭐');
          return `
            <div class="chapter-card ${status}" data-chapter="${ch.num}">
              <div class="chapter-num">${ch.num}</div>
              <div class="chapter-name">${escapeHtml(ch.name)}</div>
              <div class="chapter-mission">${escapeHtml(ch.mission)}</div>
              <div class="chapter-reward">${rewardLabel}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    root.querySelectorAll('.chapter-card').forEach(c => {
      c.addEventListener('click', () => {
        if (c.classList.contains('locked')) { toast('이전 챕터를 먼저 끝내 주세요!'); return; }
        const num = parseInt(c.getAttribute('data-chapter'), 10);
        state.quiz.chapter = num; state.quiz.mode = 'intro';
        renderStage(stage);
      });
    });
  }

  function renderChapterIntro(stage, root) {
    const chapters = stage === 2 ? STAGE2_CHAPTERS : STAGE3_CHAPTERS;
    const ch = chapters[state.quiz.chapter - 1];
    const emojis = stage === 2 ? ['🌉','🏔️','🌺','🎭','🧙‍♀️'] : ['🛤️','🤝','🏫','👨‍👩‍👧','🏡'];
    const QTYPE_TIPS = {
      fillblank:     '문장 속 빈칸에 알맞은 표현을 골라 주세요.',
      meaning2term:  '제시된 뜻에 어울리는 표현을 골라 주세요.',
      term2meaning:  '제시된 표현의 뜻을 골라 주세요.',
      term2sentence: '제시된 표현이 어울리는 문장을 골라 주세요.',
      mixed:         '여러 유형의 문제가 섞여 나옵니다. 차분히 풀어 보세요.',
      home:          '4 장면을 모두 통과했어요! 이제 집으로 돌아갈 차례예요.'
    };
    const kindLabel = ch.kind === 'mixed' ? '관용어와 속담' : (ch.kind === 'idiom' ? '관용어' : '속담');
    let extraLabel = '';
    if (ch.scene)        extraLabel = ' · ' + ch.scene + ' 장면';
    else if (ch.topics)  extraLabel = ' · ' + ch.topics.join('·');
    const startLabel = ch.qtype === 'home' ? '집으로 →' : '시작하기 →';
    const tipFooter = ch.qtype === 'home' ? '' : '<br>(10문제)';
    root.innerHTML = `
      <div class="chapter-intro-wrap">
        <div class="chapter-intro-card">
          <div class="chapter-intro-emoji">${emojis[ch.num - 1] || '🎯'}</div>
          <div class="chapter-intro-title">챕터 ${ch.num} · ${escapeHtml(ch.name)}</div>
          <div class="chapter-intro-mission">${escapeHtml(ch.mission)}</div>
          <div class="chapter-intro-tip">📝 <b>${kindLabel}${extraLabel}</b> · ${QTYPE_TIPS[ch.qtype]}${tipFooter}</div>
          <button id="chapterStart" class="btn btn-primary btn-big">${startLabel}</button>
        </div>
      </div>
    `;
    document.getElementById('chapterStart').onclick = () => {
      // 'home' 챕터(스테이지 3의 마지막)는 퀴즈 없이 바로 보상 + 컷씬
      if (ch.qtype === 'home') {
        applyChapterReward(stage);
        state.quiz.mode = 'cutscene';
        renderStage(stage);
        return;
      }
      state.quiz.questions = makeChapterQuestions(stage);
      if (state.quiz.questions.length === 0) {
        toast('문제를 만들 자료가 부족해요. (자료가 충분한지 확인해 주세요)');
        return;
      }
      state.quiz.qIndex = 0; state.quiz.qCorrect = 0;
      state.quiz.mode = 'play';
      renderStage(stage);
    };
  }

  const BLANK_MARK = 'BLANK';
  const QUESTIONS_PER_CHAPTER = 10;
  const QTYPES_ALL = ['fillblank', 'meaning2term', 'term2meaning', 'term2sentence'];

  function makeChapterQuestions(stage) {
    const chapters = stage === 2 ? STAGE2_CHAPTERS : STAGE3_CHAPTERS;
    const ch = chapters[state.quiz.chapter - 1];
    if (!ch) return [];

    // Stage 3 의 'home' 챕터는 문제 없이 바로 컷씬으로 가는 챕터
    if (ch.qtype === 'home') return [];

    const examplesKey = stage === 2 ? 'folkExamples' : 'realExamples';

    // 대상 풀: kind / topics / scene 에 따라 필터링
    let pool;
    if (ch.kind === 'mixed') {
      pool = state.idioms.map(x => Object.assign({}, x, { kind: 'idiom' }))
        .concat(state.proverbs.map(x => Object.assign({}, x, { kind: 'proverb' })));
    } else {
      const base = ch.kind === 'idiom' ? state.idioms : state.proverbs;
      pool = base.slice().map(x => Object.assign({}, x, { kind: ch.kind }));
      if (Array.isArray(ch.topics)) {
        pool = pool.filter(it => ch.topics.includes(it.topic));
      }
    }

    // Stage 3 의 scene 필터: realByScene[scene] 이 있는 항목만 사용
    if (stage === 3 && ch.scene) {
      pool = pool.filter(it => it.realByScene && it.realByScene[ch.scene]);
    }

    // 보기 4지선다라 풀에 최소 4개 필요
    if (pool.length < 4) return [];

    const picked = shuffle(pool.slice()).slice(0, Math.min(QUESTIONS_PER_CHAPTER, pool.length));
    const qs = picked.map(item => {
      const qtype = ch.qtype === 'mixed'
        ? QTYPES_ALL[Math.floor(Math.random() * QTYPES_ALL.length)]
        : ch.qtype;
      return buildQuestion(qtype, item, pool, examplesKey, ch.scene);
    }).filter(Boolean);
    return qs;
  }

  function buildQuestion(qtype, item, pool, examplesKey, sceneOverride) {
    const sameKindPool = pool.filter(p => p.kind === item.kind && p.id !== item.id);
    if (sameKindPool.length < 3) return null;

    if (qtype === 'fillblank') {
      // sceneOverride가 있으면 그 장면 예문 고정 사용, 아니면 랜덤
      let sentence;
      if (sceneOverride && item.realByScene && item.realByScene[sceneOverride]) {
        sentence = item.realByScene[sceneOverride];
      } else {
        const examples = item[examplesKey] || [];
        if (!examples.length) return null;
        sentence = examples[Math.floor(Math.random() * examples.length)];
      }
      const masked = item.kind === 'proverb' ? maskProverbExample(sentence) : maskTerm(sentence, item.term);
      const distractors = shuffle(sameKindPool).slice(0, 3).map(p => p.term);
      const choices = shuffle([item.term].concat(distractors));
      return { type: 'fillblank', item, prompt: masked, choices, answer: item.term, wrongCount: 0 };
    }

    if (qtype === 'meaning2term') {
      const distractors = shuffle(sameKindPool).slice(0, 3).map(p => p.term);
      const choices = shuffle([item.term].concat(distractors));
      return { type: 'meaning2term', item, prompt: item.meaning, choices, answer: item.term, wrongCount: 0 };
    }

    if (qtype === 'term2meaning') {
      const distractors = shuffle(sameKindPool).slice(0, 3).map(p => p.meaning);
      const choices = shuffle([item.meaning].concat(distractors));
      return { type: 'term2meaning', item, prompt: item.term, choices, answer: item.meaning, wrongCount: 0 };
    }

    if (qtype === 'term2sentence') {
      const examples = item[examplesKey] || [];
      if (!examples.length) return null;
      const correctSentence = examples[Math.floor(Math.random() * examples.length)];
      const distractorItems = shuffle(sameKindPool).slice(0, 3);
      const distractorSentences = distractorItems
        .map(d => {
          const arr = d[examplesKey] || [];
          return arr.length ? arr[Math.floor(Math.random() * arr.length)] : '';
        })
        .filter(Boolean);
      if (distractorSentences.length < 3) return null;
      const choices = shuffle([correctSentence].concat(distractorSentences));
      return { type: 'term2sentence', item, prompt: item.term, choices, answer: correctSentence, wrongCount: 0 };
    }
    return null;
  }

  /* 마스킹: 정답 위치에 BLANK_MARK 자리 표시자만 남긴다.
     렌더링 시 split 해서 빈 밑줄 span 으로 치환한다. */
  function maskProverbExample(text) {
    if (!text) return '';
    const commaIdx = text.indexOf(',');
    if (commaIdx === -1) return BLANK_MARK;
    return BLANK_MARK + text.slice(commaIdx);
  }
  function maskTerm(text, term) {
    if (!text || !term) return text || '';
    const t = String(term).trim(); if (!t) return text;
    if (text.includes(t)) return text.split(t).join(BLANK_MARK);
    // 어미 변화 등으로 정확히 일치하지 않을 때 — 가장 긴 prefix 매칭
    const minLen = Math.max(3, Math.ceil(t.length * 0.6));
    for (let i = t.length - 1; i >= minLen; i--) {
      const prefix = t.slice(0, i); const idx = text.indexOf(prefix);
      if (idx !== -1) {
        let endIdx = idx + prefix.length;
        while (endIdx < text.length && /[가-힣]/.test(text[endIdx])) endIdx++;
        return text.slice(0, idx) + BLANK_MARK + text.slice(endIdx);
      }
    }
    return text;
  }

  /* BLANK_MARK 를 포함한 문장을 안전한 HTML 로 만든다. */
  function renderMaskedHtml(masked) {
    const parts = String(masked).split(BLANK_MARK);
    return parts.map(p => escapeHtml(p)).join('<span class="blank"></span>');
  }

  function renderQuestion(stage, root) {
    const qs = state.quiz.questions;
    const i = state.quiz.qIndex;
    const q = qs[i]; if (!q) return;
    const ch = (stage === 2 ? STAGE2_CHAPTERS : STAGE3_CHAPTERS)[state.quiz.chapter - 1];
    const total = qs.length;
    const pct = Math.round(i / total * 100);

    const kindLabel = q.item.kind === 'idiom' ? '관용어' : '속담';
    let label, promptHtml, longChoices = false;
    if (q.type === 'fillblank') {
      label = `빈칸에 알맞은 ${kindLabel}을 골라 주세요`;
      promptHtml = renderMaskedHtml(q.prompt);
    } else if (q.type === 'meaning2term') {
      label = `다음 뜻에 해당하는 ${kindLabel}을 골라 주세요`;
      promptHtml = '💡 ' + escapeHtml(q.prompt);
    } else if (q.type === 'term2meaning') {
      label = `이 ${kindLabel}의 뜻을 골라 주세요`;
      promptHtml = `<b>${escapeHtml(q.prompt)}</b>`;
      longChoices = true;
    } else if (q.type === 'term2sentence') {
      label = `이 ${kindLabel}이 어울리는 문장을 골라 주세요`;
      promptHtml = `<b>${escapeHtml(q.prompt)}</b>`;
      longChoices = true;
    }

    root.innerHTML = `
      <div class="quiz-meta">
        <span>챕터 ${ch.num} · ${escapeHtml(ch.name)}</span>
        <span>${i + 1} / ${total} · 맞은 개수: ${state.quiz.qCorrect}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="quiz-play">
        <div class="quiz-question">
          <div class="quiz-q-label">${label}</div>
          <div class="quiz-q-text">${promptHtml}</div>
        </div>
        <div class="choices ${longChoices ? 'long' : ''}" id="quizChoices"></div>
        <div class="quiz-next-wrap">
          <button id="qNext" class="btn btn-primary btn-big hidden">다음 →</button>
        </div>
      </div>
    `;
    const wrap = root.querySelector('#quizChoices');
    q.choices.forEach(text => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = text;
      b.addEventListener('click', () => onAnswer(stage, b, text, q));
      wrap.appendChild(b);
    });
    root.querySelector('#qNext').addEventListener('click', () => nextQuestion(stage));
  }

  function onAnswer(stage, btn, picked, q) {
    const isCorrect = picked === q.answer;
    if (isCorrect) {
      document.querySelectorAll('#quizChoices .choice').forEach(c => { c.disabled = true; if (c.textContent === q.answer) c.classList.add('correct'); });
      state.quiz.qCorrect++;
      showOverlay('🎉 정답!', 'correct', 800);
      saveAttempt(state.currentStudent, { stage, chapter: state.quiz.chapter, kind: q.item.kind, id: q.item.id, term: q.item.term, meaning: q.item.meaning, correct: true, ts: Date.now() });
      apiPost('logQuiz', { record: { studentName: state.currentStudent, kind: q.item.kind, id: q.item.id, term: q.item.term, correct: true } });
      const next = document.getElementById('qNext');
      next.classList.remove('hidden');
      const isLast = state.quiz.qIndex === state.quiz.questions.length - 1;
      next.textContent = isLast ? '챕터 결과 보기 →' : '다음 →';
    } else {
      btn.classList.add('wrong'); btn.disabled = true;
      q.wrongCount++;
      if (q.wrongCount === 1) {
        showOverlay('<b style="font-size:22px;color:var(--secondary-dark)">다시 한 번 잘 봐요</b><br><br>문장에 어울리는 표현을 한 번 더 생각해 보세요!', 'hint-soft', 2200);
      } else if (q.wrongCount >= 2) {
        document.querySelectorAll('#quizChoices .choice').forEach(c => { c.disabled = true; });
        showOverlay('<b style="font-size:22px;color:var(--secondary-dark)">사전에서 같이 찾아볼까요?</b><br><br>천천히 익히면 다음엔 잘 할 수 있어요 😊', 'hint-soft', 2400);
        saveAttempt(state.currentStudent, { stage, chapter: state.quiz.chapter, kind: q.item.kind, id: q.item.id, term: q.item.term, meaning: q.item.meaning, correct: false, ts: Date.now() });
        apiPost('logQuiz', { record: { studentName: state.currentStudent, kind: q.item.kind, id: q.item.id, term: q.item.term, correct: false } });
        const next = document.getElementById('qNext');
        next.classList.remove('hidden');
        const isLast = state.quiz.qIndex === state.quiz.questions.length - 1;
        next.textContent = isLast ? '챕터 결과 보기 →' : '다음 →';
      }
    }
  }

  function nextQuestion(stage) {
    state.quiz.qIndex++;
    if (state.quiz.qIndex >= state.quiz.questions.length) state.quiz.mode = 'result';
    renderStage(stage);
  }

  function renderChapterResult(stage, root) {
    const correct = state.quiz.qCorrect;
    const total = state.quiz.questions.length;
    const rate = correct / total;
    const emoji = rate === 1 ? '🏆' : (rate >= 0.7 ? '😄' : (rate >= 0.4 ? '🙂' : '💪'));
    root.innerHTML = `
      <div class="result-wrap">
        <div class="result-card">
          <div class="result-emoji">${emoji}</div>
          <h2>챕터 ${state.quiz.chapter} 완료!</h2>
          <p class="result-score">정답 <span>${correct}</span> / <span>${total}</span></p>
          <div class="result-buttons">
            <button id="goRewardCut" class="btn btn-primary">다음으로 →</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('goRewardCut').onclick = () => {
      applyChapterReward(stage);
      state.quiz.mode = 'cutscene';
      renderStage(stage);
    };
  }

  function applyChapterReward(stage) {
    const ch = state.quiz.chapter;
    if (stage === 2) {
      if (state.progress.stage2Chapter < ch) state.progress.stage2Chapter = ch;
      const chapter = STAGE2_CHAPTERS[ch - 1];
      if (chapter && chapter.rewardKey && !state.progress.challenges.includes(chapter.rewardKey)) {
        state.progress.challenges.push(chapter.rewardKey);
      }
    } else {
      if (state.progress.stage3Chapter < ch) state.progress.stage3Chapter = ch;
      const chapter = STAGE3_CHAPTERS[ch - 1];
      if (chapter && chapter.rewardKey && !state.progress.challenges.includes(chapter.rewardKey)) {
        state.progress.challenges.push(chapter.rewardKey);
      }
      if (ch === 5) state.progress.homeReturned = true;
    }
    saveProgress(state.currentStudent);
  }

  function renderStageCutscene(stage, root) {
    const ch = state.quiz.chapter;
    let key = null;
    if (stage === 2) {
      key = STAGE2_CHAPTERS[ch - 1] && STAGE2_CHAPTERS[ch - 1].rewardKey;
    } else if (stage === 3) {
      // 챕터 5는 'home' 고정, 그 외는 STAGE3_CHAPTERS 의 rewardKey
      key = (ch === 5) ? 'home' : (STAGE3_CHAPTERS[ch - 1] && STAGE3_CHAPTERS[ch - 1].rewardKey);
    }
    if (!key) { state.quiz.mode = 'list'; renderStage(stage); return; }
    const cs = CUTSCENES[key];
    if (!cs) { state.quiz.mode = 'list'; renderStage(stage); return; }
    root.innerHTML = renderCutscene(cs);
    document.getElementById('cutsceneNext').onclick = () => {
      if (ch === 5) { show('home'); return; }
      state.quiz.chapter = ch + 1;
      if (state.quiz.chapter > 5) { show('home'); return; }
      state.quiz.mode = 'intro';
      renderStage(stage);
    };
  }

  /* ====== 사전 (자동완성 + 상세 보기) ====== */
  document.querySelectorAll('#screen-dictionary .tabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#screen-dictionary .tabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.dictKind = tab.getAttribute('data-kind');
      resetDict();
    });
  });
  document.getElementById('searchBox').addEventListener('input', () => {
    if (!document.getElementById('searchBox').value.trim()) {
      state.dictSelected = null;
      renderDictDetail();
    }
    showAutocomplete();
  });
  document.getElementById('searchBox').addEventListener('focus', () => {
    if (document.getElementById('searchBox').value.trim()) showAutocomplete();
  });
  document.addEventListener('click', (e) => {
    const sw = document.querySelector('.search-wrap');
    if (sw && !sw.contains(e.target)) hideAutocomplete();
  });

  function renderDict() {
    resetDict();
  }
  function resetDict() {
    state.dictSelected = null;
    const sb = document.getElementById('searchBox');
    if (sb) sb.value = '';
    hideAutocomplete();
    renderDictDetail();
  }

  function renderDictDetail() {
    const root = document.getElementById('dictDetail');
    if (!state.dictSelected) {
      root.innerHTML = `
        <div class="dict-detail-empty">
          <span class="emoji">🔍</span>
          위 검색창에 <b>관용어나 속담의 앞 글자</b>를 입력해 보세요.<br>
          목록이 자동으로 뜨면 하나를 골라 자세히 볼 수 있어요.
        </div>
      `;
      return;
    }
    const it = state.dictSelected;
    const ex = (Array.isArray(it.realExamples) && it.realExamples[0]) ? it.realExamples[0] : (it.example || '');
    root.innerHTML = `
      <div class="dict-detail-card">
        <div class="dict-detail-term">${renderTopicBadge(it.topic)}${escapeHtml(it.term)}</div>
        <div class="dict-detail-meaning">${escapeHtml(it.meaning)}</div>
        ${ex ? `<div class="dict-detail-example">예) ${escapeHtml(ex)}</div>` : ''}
      </div>
    `;
  }

  function showAutocomplete() {
    const kw = document.getElementById('searchBox').value.trim();
    const items = state.dictKind === 'idiom' ? state.idioms : state.proverbs;
    const ac = document.getElementById('autocomplete');
    if (!kw) { hideAutocomplete(); return; }
    // 앞 글자 우선 매치 → 부족하면 포함 매치도 추가
    const startsWith = items.filter(it => it.term.startsWith(kw));
    const contains = items.filter(it => !it.term.startsWith(kw) && it.term.includes(kw));
    const matches = startsWith.concat(contains).slice(0, 10);
    if (matches.length === 0) {
      ac.innerHTML = '<div class="autocomplete-empty">결과가 없어요. 다른 글자로 찾아 보세요.</div>';
      ac.classList.remove('hidden');
      return;
    }
    ac.innerHTML = matches.map(it => `<div class="autocomplete-item" data-id="${it.id}">${renderTopicBadge(it.topic)}${escapeHtml(it.term)}</div>`).join('');
    ac.classList.remove('hidden');
    ac.querySelectorAll('.autocomplete-item').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.getAttribute('data-id'), 10);
        const list = state.dictKind === 'idiom' ? state.idioms : state.proverbs;
        state.dictSelected = list.find(x => x.id === id);
        document.getElementById('searchBox').value = state.dictSelected.term;
        hideAutocomplete();
        renderDictDetail();
      });
    });
  }
  function hideAutocomplete() {
    const ac = document.getElementById('autocomplete');
    if (ac) ac.classList.add('hidden');
  }

  /* ====== 내 기록 ====== */
  document.querySelectorAll('[data-progress-tab]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('[data-progress-tab]').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const which = tab.getAttribute('data-progress-tab');
      document.getElementById('recentList').classList.toggle('hidden', which !== 'recent');
      document.getElementById('wrongList').classList.toggle('hidden', which !== 'wrong');
    });
  });

  function renderProgress() {
    const attempts = loadAttempts(state.currentStudent);
    const total = attempts.length;
    const correct = attempts.filter(a => a.correct).length;
    const rate = total ? Math.round(correct / total * 100) : 0;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statCorrect').textContent = correct;
    document.getElementById('statRate').textContent = rate + '%';

    const rank = getRank(correct);
    document.getElementById('rankEmoji').textContent = rank.current.emoji;
    document.getElementById('rankName').textContent = rank.current.name;
    if (rank.next) {
      const need = rank.next.min - correct;
      document.getElementById('rankProgress').textContent = '다음 등급 ' + rank.next.emoji + ' ' + rank.next.name + '까지 정답 ' + need + '개!';
      const span = rank.next.min - rank.current.min;
      const got = correct - rank.current.min;
      document.getElementById('rankFill').style.width = Math.min(100, Math.round(got / span * 100)) + '%';
    } else {
      document.getElementById('rankProgress').textContent = '🎊 최고 등급에 도달했어요!';
      document.getElementById('rankFill').style.width = '100%';
    }

    document.getElementById('friendGrid').innerHTML = FRIENDS.map(f => {
      const got = state.progress.friends.includes(f.key);
      return `<div class="friend-item ${got ? 'got' : 'lock'}"><div class="friend-emoji">${got ? f.emoji : '❓'}</div><div class="friend-name">${escapeHtml(f.name)}</div></div>`;
    }).join('');

    document.getElementById('stampGrid').innerHTML = CHALLENGES.map(c => {
      const got = state.progress.challenges.includes(c.key);
      return `<div class="stamp-item ${got ? 'got' : 'lock'}"><div class="stamp-emoji">${got ? c.emoji : '🔒'}</div><div class="stamp-name">${escapeHtml(c.name)}</div></div>`;
    }).join('');

    const recent = attempts.slice().reverse().slice(0, 8);
    const recentList = document.getElementById('recentList');
    if (recent.length === 0) {
      recentList.innerHTML = '<div class="empty-msg">아직 푼 문제가 없어요.</div>';
    } else {
      recentList.innerHTML = recent.map(r => `
        <div class="recent-item">
          <div class="recent-mark ${r.correct ? 'ok' : 'no'}">${r.correct ? 'O' : 'X'}</div>
          <div class="recent-term">${escapeHtml(r.term)}</div>
          <div class="recent-kind">${r.kind === 'idiom' ? '관용어' : '속담'}</div>
        </div>
      `).join('');
    }

    const seen = new Set(); const wrongs = [];
    for (let i = attempts.length - 1; i >= 0; i--) {
      const a = attempts[i]; if (a.correct) continue;
      const k = a.kind + ':' + a.id; if (seen.has(k)) continue;
      seen.add(k); wrongs.push(a);
    }
    const wrongList = document.getElementById('wrongList');
    if (wrongs.length === 0) {
      wrongList.innerHTML = '<div class="empty-msg">틀린 문제가 없어요. 잘하고 있어요!</div>';
    } else {
      wrongList.innerHTML = wrongs.slice(0, 8).map(r => `
        <div class="recent-item">
          <div class="recent-mark no">X</div>
          <div class="recent-term">${escapeHtml(r.term)}</div>
          <div class="recent-kind">${r.kind === 'idiom' ? '관용어' : '속담'}</div>
        </div>
      `).join('');
    }
  }

  /* ====== 유틸 ====== */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ====== 부팅 ====== */
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('screen-login').classList.add('active');
    init();
  });
</script>

</body>
</html>
